<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nnx-transformer-arch-title nnx-transformer-arch-desc" id="d-02-nnx-transformer-arch-root">
        <title id="nnx-transformer-arch-title">Flax NNX Mini-Transformer Architecture</title>
        <desc id="nnx-transformer-arch-desc">Left-to-right architecture of MiniTransformerLM in Flax NNX showing token embeddings, 2x TransformerBlock layers with CausalRoPEAttention and SwiGLUMLP, final RMSNorm, LM Head, and typed nnx.Param vs RoPECache state variables.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-nnx-transformer-arch-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-02-nnx-transformer-arch-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-02-nnx-transformer-arch-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-02-nnx-transformer-arch-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-02-nnx-transformer-arch-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.85" fill="#0f2547" fill-opacity="0.10"/>
          </pattern>
          <marker id="d-02-nnx-transformer-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/>
          </marker>
          <marker id="d-02-nnx-transformer-arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#C59216"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="1040" height="560" fill="#F7F6F2"/>
        <rect width="1040" height="560" fill="url(#d-02-nnx-transformer-arch-dots)" opacity="0.55"/>

        <!-- ZONES (drawn before arrows and nodes) -->
        <!-- Zone 1: Decoder Block Stack -->
        <rect x="240" y="24" width="520" height="272" rx="8" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.18" stroke-width="1"/>
        <rect x="256" y="28" width="268" height="16" rx="2" fill="#EFECE6"/>
        <text x="390" y="39" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.12em">2× TRANSFORMER BLOCK (nnx.List)</text>

        <!-- Zone 2: Typed NNX State & PRNG Governance -->
        <rect x="240" y="336" width="520" height="132" rx="8" fill="#0f2547" fill-opacity="0.03" stroke="#0f2547" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="256" y="340" width="296" height="16" rx="2" fill="#F7F6F2"/>
        <text x="404" y="351" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.12em">TYPED STATE FILTERING (nnx.state)</text>

        <!-- ARROWS (all orthogonal, drawn before boxes, distinct fan attach points, zero crossings) -->
        <!-- Embed -> CausalRoPEAttention (main forward path at y=160) -->
        <line x1="196" y1="160" x2="268" y2="160" stroke="#C59216" stroke-width="1.5" marker-end="url(#d-02-nnx-transformer-arch-arrow-accent)"/>

        <!-- CausalRoPEAttention -> SwiGLUMLP -->
        <line x1="484" y1="160" x2="532" y2="160" stroke="#C59216" stroke-width="1.5" marker-end="url(#d-02-nnx-transformer-arch-arrow-accent)"/>

        <!-- Residual bypass ABOVE modules (from Embed fan port y=116 to Final Norm fan port y=116) -->
        <path d="M 196 116 H 216 Q 224 116 224 108 V 68 Q 224 60 232 60 H 768 Q 776 60 776 68 V 108 Q 776 116 784 116 H 800" fill="none" stroke="#3B5B8C" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#d-02-nnx-transformer-arch-arrow)"/>
        <rect x="440" y="68" width="120" height="16" rx="2" fill="#EFECE6"/>
        <text x="500" y="79" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">RESIDUAL (+)</text>

        <!-- SwiGLUMLP -> Final Norm + LM Head -->
        <line x1="728" y1="160" x2="800" y2="160" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-nnx-transformer-arch-arrow)"/>

        <!-- RoPECache -> CausalRoPEAttention (vertical orthogonal upward, zero crossing) -->
        <line x1="376" y1="372" x2="376" y2="232" stroke="#C59216" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#d-02-nnx-transformer-arch-arrow-accent)"/>
        <rect x="384" y="308" width="108" height="16" rx="2" fill="#F7F6F2"/>
        <text x="438" y="319" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">COS/SIN TABLES</text>

        <!-- nnx.Param -> SwiGLUMLP (vertical orthogonal upward, 4px grid, zero crossing) -->
        <line x1="628" y1="372" x2="628" y2="232" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-02-nnx-transformer-arch-arrow)"/>
        <rect x="636" y="308" width="112" height="16" rx="2" fill="#F7F6F2"/>
        <text x="692" y="319" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">WRT=NNX.PARAM</text>

        <!-- NODES (all on 4px grid) -->
        <!-- Node 1: Token Embed -->
        <rect x="32" y="96" width="164" height="104" rx="6" fill="#F7F6F2" stroke="#0F2547" stroke-width="1.2"/>
        <rect x="44" y="108" width="56" height="16" rx="2" fill="#0f2547" fill-opacity="0.08"/>
        <text x="72" y="119" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">INPUT</text>
        <text x="44" y="142" fill="#0F2547" font-family="'Geist', sans-serif" font-size="14" font-weight="600">nnx.Embed</text>
        <text x="44" y="162" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="10">vocab=128 · d=64</text>
        <text x="44" y="180" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">token_ids: (8, 32)</text>

        <!-- Node 2 (FOCAL 1): CausalRoPEAttention -->
        <rect x="268" y="104" width="216" height="128" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.8"/>
        <rect x="280" y="116" width="76" height="16" rx="2" fill="#c59216" fill-opacity="0.22"/>
        <text x="318" y="127" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">ATTENTION</text>
        <text x="280" y="150" fill="#0F2547" font-family="'Geist', sans-serif" font-size="14" font-weight="600">CausalRoPEAttention</text>
        <text x="280" y="170" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="10">Pre-RMSNorm + 4 Heads</text>
        <text x="280" y="188" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">q, k, v, out: nnx.Linear</text>
        <text x="280" y="206" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">tril mask · leakage = 0.0</text>

        <!-- Node 3: SwiGLUMLP -->
        <rect x="532" y="104" width="196" height="128" rx="6" fill="#F7F6F2" stroke="#0F2547" stroke-width="1.2"/>
        <rect x="544" y="116" width="60" height="16" rx="2" fill="#0f2547" fill-opacity="0.08"/>
        <text x="574" y="127" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">FFN</text>
        <text x="544" y="150" fill="#0F2547" font-family="'Geist', sans-serif" font-size="14" font-weight="600">SwiGLUMLP</text>
        <text x="544" y="170" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="10">Pre-RMSNorm · d_ff=192</text>
        <text x="544" y="188" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">silu(w_gate(x)) * w_up(x)</text>
        <text x="544" y="206" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">w_down projection</text>

        <!-- Node 4: Final RMSNorm + LM Head -->
        <rect x="800" y="96" width="208" height="104" rx="6" fill="#F7F6F2" stroke="#0F2547" stroke-width="1.2"/>
        <rect x="812" y="108" width="64" height="16" rx="2" fill="#0f2547" fill-opacity="0.08"/>
        <text x="844" y="119" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">OUTPUT</text>
        <text x="812" y="142" fill="#0F2547" font-family="'Geist', sans-serif" font-size="14" font-weight="600">RMSNorm + LM Head</text>
        <text x="812" y="162" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="10">nnx.Linear(64, 128)</text>
        <text x="812" y="180" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">logits: (8, 32, 128)</text>

        <!-- Node 5 (FOCAL 2): RoPECache (Static Non-Differentiable Variable) -->
        <rect x="268" y="372" width="216" height="80" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.5"/>
        <text x="280" y="396" fill="#0F2547" font-family="'Geist', sans-serif" font-size="13" font-weight="600">RoPECache(nnx.Variable)</text>
        <text x="280" y="416" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="10">rope_cos, rope_sin tables</text>
        <text x="280" y="434" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">Excluded from Optax grads</text>

        <!-- Node 6: Trainable nnx.Param Filter -->
        <rect x="532" y="372" width="196" height="80" rx="6" fill="#F7F6F2" stroke="#0F2547" stroke-width="1.2"/>
        <text x="544" y="396" fill="#0F2547" font-family="'Geist', sans-serif" font-size="13" font-weight="600">nnx.Param Weights</text>
        <text x="544" y="416" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="10">123,200 trainable scalars</text>
        <text x="544" y="434" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="9.5">Updated via AdamW</text>

        <!-- Bottom Legend Strip -->
        <line x1="32" y1="500" x2="1008" y2="500" stroke="#0f2547" stroke-opacity="0.16" stroke-width="1"/>
        <rect x="32" y="516" width="14" height="14" rx="2" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
        <text x="54" y="527" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="10">Focal Module / Custom Variable (#C59216)</text>

        <rect x="348" y="516" width="14" height="14" rx="2" fill="#F7F6F2" stroke="#0F2547" stroke-width="1.2"/>
        <text x="370" y="527" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="10">Standard NNX Layer (#0F2547)</text>

        <line x1="600" y1="523" x2="636" y2="523" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="646" y="527" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="10">Residual / State Filter Binding</text>
      </svg>
