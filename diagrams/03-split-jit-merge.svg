<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 848 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="split-jit-merge-title split-jit-merge-desc" id="d-03-split-jit-merge-root">
        <title id="split-jit-merge-title">Flax NNX Split-JIT-Merge Compilation Lifecycle</title>
        <desc id="split-jit-merge-desc">Six-step process across Python Host, NNX Graph Bridge, and OpenXLA Runtime showing how nnx.split extracts GraphDef and State for single-trace XLA execution and nnx.update restores mutated weights.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-split-jit-merge-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-03-split-jit-merge-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-03-split-jit-merge-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-split-jit-merge-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-03-split-jit-merge-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="#0f2547" fill-opacity="0.10"/>
          </pattern>
          <marker id="d-03-split-jit-merge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/>
          </marker>
          <marker id="d-03-split-jit-merge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#C59216"/>
          </marker>
        </defs>

        <!-- Paper & Dots -->
        <rect width="848" height="356" fill="#F7F6F2"/>
        <rect width="848" height="356" fill="url(#d-03-split-jit-merge-dots)" opacity="0.55"/>

        <!-- Alternating Lane Tints (Lanes 0 and 2) -->
        <rect x="140" y="36" width="708" height="80" fill="#0f2547" fill-opacity="0.025"/>
        <rect x="140" y="196" width="708" height="80" fill="#0f2547" fill-opacity="0.025"/>

        <!-- Lane Dividers & Label Column Border -->
        <line x1="0" y1="36" x2="848" y2="36" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="848" y2="116" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="848" y2="196" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="848" y2="276" stroke="#0f2547" stroke-opacity="0.18" stroke-width="1"/>
        <line x1="140" y1="36" x2="140" y2="276" stroke="#0f2547" stroke-opacity="0.22" stroke-width="1"/>

        <!-- Step Header Chips (step_cx = 198, 310, 422, 534, 646, 758) -->
        <!-- Step 1 -->
        <rect x="190" y="8" width="16" height="16" rx="8" fill="#0f2547" fill-opacity="0.12"/>
        <text x="198" y="19" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">1</text>
        <text x="198" y="32" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle">INIT</text>

        <!-- Step 2 -->
        <rect x="302" y="8" width="16" height="16" rx="8" fill="#0f2547" fill-opacity="0.12"/>
        <text x="310" y="19" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">2</text>
        <text x="310" y="32" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle">SPLIT</text>

        <!-- Step 3 (FOCAL STEP) -->
        <rect x="414" y="8" width="16" height="16" rx="8" fill="#c59216" fill-opacity="0.22"/>
        <text x="422" y="19" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">3</text>
        <text x="422" y="32" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" letter-spacing="0.12em" text-anchor="middle">COMPILE</text>

        <!-- Step 4 -->
        <rect x="526" y="8" width="16" height="16" rx="8" fill="#0f2547" fill-opacity="0.12"/>
        <text x="534" y="19" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">4</text>
        <text x="534" y="32" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle">STEP</text>

        <!-- Step 5 -->
        <rect x="638" y="8" width="16" height="16" rx="8" fill="#0f2547" fill-opacity="0.12"/>
        <text x="646" y="19" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">5</text>
        <text x="646" y="32" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle">MERGE</text>

        <!-- Step 6 -->
        <rect x="750" y="8" width="16" height="16" rx="8" fill="#0f2547" fill-opacity="0.12"/>
        <text x="758" y="19" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">6</text>
        <text x="758" y="32" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle">SYNC</text>

        <!-- Lane Labels (x = 70, mid_y = 76, 156, 236) -->
        <text x="70" y="72" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.08em" text-anchor="middle">PYTHON</text>
        <text x="70" y="84" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle">HOST OBJECT</text>

        <text x="70" y="152" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.08em" text-anchor="middle">NNX GRAPH</text>
        <text x="70" y="164" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle">BRIDGE</text>

        <text x="70" y="232" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.08em" text-anchor="middle">OPENXLA</text>
        <text x="70" y="244" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle">RUNTIME</text>

        <!-- ARROWS (Emitted before all node rects, single-bend orthogonal r=8) -->
        <!-- Step 0 (PYH, lane 0) -> Step 1 (NNX, lane 1): downward -->
        <path d="M 248,76 H 302 Q 310,76 310,84 V 124" fill="none" stroke="#3B5B8C" stroke-width="1.1" marker-end="url(#d-03-split-jit-merge-arrow)"/>

        <!-- Step 1 (NNX, lane 1) -> Step 2 (XLA, lane 2, FOCAL): focal-in downward -->
        <path d="M 360,156 H 414 Q 422,156 422,164 V 204" fill="none" stroke="#C59216" stroke-width="1.4" marker-end="url(#d-03-split-jit-merge-arrow-accent)"/>

        <!-- Step 2 (XLA, lane 2, FOCAL) -> Step 3 (XLA, lane 2): focal-out same-lane -->
        <line x1="472" y1="236" x2="484" y2="236" stroke="#C59216" stroke-width="1.4" marker-end="url(#d-03-split-jit-merge-arrow-accent)"/>

        <!-- Step 3 (XLA, lane 2) -> Step 4 (NNX, lane 1): upward -->
        <path d="M 584,236 H 638 Q 646,236 646,228 V 188" fill="none" stroke="#3B5B8C" stroke-width="1.1" marker-end="url(#d-03-split-jit-merge-arrow)"/>

        <!-- Step 4 (NNX, lane 1) -> Step 5 (PYH, lane 0): upward -->
        <path d="M 696,156 H 750 Q 758,156 758,148 V 108" fill="none" stroke="#3B5B8C" stroke-width="1.1" marker-end="url(#d-03-split-jit-merge-arrow)"/>

        <!-- NODES (100x64 at node_x = step_cx - 50, node_y = lane_y_top + 8) -->
        <!-- Node 0: Lane 0 (PYH), Step 0 (x=148, y=44) -->
        <rect x="148" y="44" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="152" y="48" width="18" height="10" rx="2" fill="#0f2547" fill-opacity="0.10"/>
        <text x="161" y="55.5" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">PYH</text>
        <text x="198" y="70" fill="#0F2547" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Model + Opt</text>
        <text x="198" y="84" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">Stateful refs</text>
        <text x="198" y="96" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">nnx.Rngs(42)</text>

        <!-- Node 1: Lane 1 (NNX), Step 1 (x=260, y=124) -->
        <rect x="260" y="124" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="264" y="128" width="18" height="10" rx="2" fill="#0f2547" fill-opacity="0.10"/>
        <text x="273" y="135.5" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">NNX</text>
        <text x="310" y="150" fill="#0F2547" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">nnx.split()</text>
        <text x="310" y="164" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">Object → PyTree</text>
        <text x="310" y="176" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">GraphDef + State</text>

        <!-- Node 2 (FOCAL NODE): Lane 2 (XLA), Step 2 (x=372, y=204) -->
        <rect x="372" y="204" width="100" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
        <rect x="376" y="208" width="18" height="10" rx="2" fill="#c59216" fill-opacity="0.24"/>
        <text x="385" y="215.5" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">XLA</text>
        <text x="422" y="230" fill="#0F2547" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">StableHLO</text>
        <text x="422" y="244" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">1 trace · 0 recomp</text>
        <text x="422" y="256" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">Fused HLO kernel</text>

        <!-- Node 3: Lane 2 (XLA), Step 3 (x=484, y=204) -->
        <rect x="484" y="204" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="488" y="208" width="18" height="10" rx="2" fill="#0f2547" fill-opacity="0.10"/>
        <text x="497" y="215.5" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">XLA</text>
        <text x="534" y="230" fill="#0F2547" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Grad + AdamW</text>
        <text x="534" y="244" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">State → State'</text>
        <text x="534" y="256" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">Pure tensor ops</text>

        <!-- Node 4: Lane 1 (NNX), Step 4 (x=596, y=124) -->
        <rect x="596" y="124" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="600" y="128" width="18" height="10" rx="2" fill="#0f2547" fill-opacity="0.10"/>
        <text x="609" y="135.5" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">NNX</text>
        <text x="646" y="150" fill="#0F2547" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">nnx.merge()</text>
        <text x="646" y="164" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">PyTree → Object</text>
        <text x="646" y="176" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">0.0 weight drift</text>

        <!-- Node 5: Lane 0 (PYH), Step 5 (x=708, y=44) -->
        <rect x="708" y="44" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="712" y="48" width="18" height="10" rx="2" fill="#0f2547" fill-opacity="0.10"/>
        <text x="721" y="55.5" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">PYH</text>
        <text x="758" y="70" fill="#0F2547" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">nnx.update()</text>
        <text x="758" y="84" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">In-place sync</text>
        <text x="758" y="96" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">Ready for step+1</text>

        <!-- Legend Strip (y = 276..356) -->
        <text x="144" y="298" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.08em">STEPS</text>
        <text x="210" y="298" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="7.5">1 INIT · 2 SPLIT · </text>
        <text x="314" y="298" fill="#9A6F0B" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="600">3 COMPILE (FOCAL)</text>
        <text x="424" y="298" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="7.5"> · 4 STEP · 5 MERGE · 6 SYNC</text>

        <text x="144" y="320" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.08em">FLOW</text>
        <line x1="210" y1="317" x2="238" y2="317" stroke="#C59216" stroke-width="1.4" marker-end="url(#d-03-split-jit-merge-arrow-accent)"/>
        <text x="246" y="320" fill="#0F2547" font-family="'Geist Mono', monospace" font-size="7.5">Focal XLA Compilation Handoff</text>

        <line x1="440" y1="317" x2="468" y2="317" stroke="#3B5B8C" stroke-width="1.1" marker-end="url(#d-03-split-jit-merge-arrow)"/>
        <text x="476" y="320" fill="#3B5B8C" font-family="'Geist Mono', monospace" font-size="7.5">Standard PyTree State Handoff</text>
      </svg>
