[project]
name = "flax-nnx-transformer-from-scratch"
version = "0.1.0"
description = "Stateful Ergonomics, Pure XLA Speed: Building and Compiling a Mini-Transformer from Scratch in Flax NNX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Adrián Catalán" }
]
dependencies = [
  "jax>=0.4.30",
  "flax>=0.10.0",
  "optax>=0.2.2",
  "torch>=2.2.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
